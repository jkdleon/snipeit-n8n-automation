services:
  app:
    image: snipe/snipe-it:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage:/var/lib/snipeit
      - ./rds-ca/global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_IP: ${ADMIN_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ca:/etc/caddy/ca:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  storage:
  caddy_data:
  caddy_config:
